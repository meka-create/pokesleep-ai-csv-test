name: PokeSleep independent daily post-publish audit (HOLD)
on:
  schedule:
    # Primary updater: 04:00 JST. Independent observer: 06:15 JST.
    # 21:15 UTC = 06:15 JST next day. GitHub cron may be delayed.
    - cron: '15 21 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - validation/r6-3-postpublish-watch-20261010
    paths:
      - .github/workflows/postpublish-audit.yml
      - scripts/audit_daily_health.py
      - tests/test_daily_health.py
permissions:
  contents: read
  actions: read
concurrency:
  group: pokesleep-postpublish-audit
  cancel-in-progress: false
jobs:
  independently-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Independent audit negative and positive regressions
        run: |
          python -m py_compile scripts/audit_daily_health.py scripts/verify_pages_live.py
          python -m unittest discover -s tests -p 'test_daily_health.py' -v
          python -m unittest discover -s tests -p 'test_release_health.py' -v
      - name: Independently verify latest daily workflow, all kit SHA pins and actual public Pages bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_daily_health.py \
            --site . --report postpublish_evidence/POSTPUBLISH_RESULT.json \
            --max-age-hours 34 --public-attempts 3 --public-delay 12
      - name: Preserve full PASS or ATTENTION evidence without public UI changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokesleep-postpublish-independent-audit-HOLD
          path: postpublish_evidence/
          if-no-files-found: warn
          retention-days: 30
