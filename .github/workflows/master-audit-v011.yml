name: Compare pokesleep-tool current master to v0.11 (NO DEPLOY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this repo (audit files only)
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Clone and pin upstream HEAD as data ONLY
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/nitoyon/pokesleep-tool.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" rev-parse HEAD
      - name: Compare source and baseline; NEVER deploy
        shell: bash
        run: |
          python audit/master_diff.py \
            --upstream "$RUNNER_TEMP/upstream" \
            --baseline audit/MASTER_v011_BASELINE.json \
            --baseline-sha256 d60410ba1f92d80c67ca3ff40bc8aa7a2cd51d4c03fc33f9e99fa83bb8e77a38 \
            --out audit_results
      - name: Publish evidence artifact even if comparison fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokesleep-master-audit-NOT-PRODUCTION
          path: audit_results/
          retention-days: 30
          if-no-files-found: warn
# No write permission, no deployment, no auto master promotion, no CSV unlock.
